<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Webhook Token Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,sans-serif;
  color:#fee2e2;
}
.container{
  width:94%;
  max-width:520px;
  padding:24px;
  background:linear-gradient(145deg,#1a0000,#000);
  border-radius:18px;
  border:1px solid #7f1d1d;
  box-shadow:0 0 40px rgba(239,68,68,.35);
}
h1{
  text-align:center;
  margin-bottom:18px;
  font-size:26px;
  background:linear-gradient(90deg,#fecaca,#ef4444,#7f1d1d);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
textarea{
  width:100%;
  margin-top:10px;
  padding:14px;
  border-radius:12px;
  background:#000;
  color:#fee2e2;
  border:1px solid #7f1d1d;
  font-size:14px;
  resize:none;
  height:140px;
}
button{
  width:100%;
  margin-top:14px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  border-radius:14px;
  border:none;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#dc2626,#ef4444,#7f1d1d);
}
.log{
  margin-top:14px;
  padding:10px;
  font-size:13px;
  min-height:80px;
  max-height:160px;
  overflow:auto;
  color:#fecaca;
  border:1px solid #7f1d1d;
  border-radius:10px;
  background:#050000;
}
</style>
</head>

<body>
<div class="container">
  <h1>Webhook Token Checker</h1>

  <textarea id="token" placeholder="WebhookのURLを貼り付けてください"></textarea>

  <button onclick="check()">チェック</button>

  <div class="log" id="log">[準備完了] トークンを入力してチェックしてください</div>
</div>

<script>
const tokenEl = document.getElementById("token");
const logEl = document.getElementById("log");

function now(){
  const d=new Date();
  return `[${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}:${d.getSeconds().toString().padStart(2,"0")}]`;
}

function log(text){
  logEl.innerHTML += `<br>${now()} ${text}`;
  logEl.scrollTop = logEl.scrollHeight;
}

function isWebhookUrl(url){
  return /^https:\/\/(canary\.|ptb\.)?discord\.com\/api\/webhooks\/\d+\/[\w-]+$/i.test(url);
}

function check(){
  logEl.innerHTML = "";
  const url = tokenEl.value.trim();

  log("チェック開始");

  if(!url){
    log("❌ トークンが入力されていません");
    return;
  }

  if(!isWebhookUrl(url)){
    log("❌ WebhookのURL形式ではありません");
    return;
  }

  log("⏳ Webhookに接続中…");

  fetch(url,{ method:"GET" })
    .then(res=>{
      if(res.ok){
        log("✅ このWebhookトークンは使えます");
      }else{
        log("❌ このWebhookトークンは使えません");
      }
    })
    .catch(()=>{
      log("⚠ CORS制限により判定不可（無効の可能性あり）");
    });
}
</script>
</body>
</html>
