<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Webhook Token Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,sans-serif;
  color:#fee2e2;
}

.container{
  width:92%;
  max-width:520px;
  padding:24px;
  background:linear-gradient(145deg,#1a0000,#000);
  border-radius:18px;
  border:1px solid #7f1d1d;
  box-shadow:0 0 40px rgba(239,68,68,.35);
}

h1{
  text-align:center;
  margin-bottom:18px;
  font-size:26px;
  background:linear-gradient(90deg,#fecaca,#ef4444,#7f1d1d);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#000;
  color:#fee2e2;
  border:1px solid #7f1d1d;
  font-size:14px;
  resize:none;
  height:130px;
}

button{
  width:100%;
  margin-top:12px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  border-radius:14px;
  border:none;
  cursor:pointer;
  color:white;
}

.check{
  background:linear-gradient(135deg,#dc2626,#ef4444,#7f1d1d);
}

.clear{
  background:#111;
}

.log{
  margin-top:14px;
  font-size:13px;
  max-height:170px;
  overflow:auto;
  color:#fecaca;
}

/* ログ色 */
.ok{color:#22c55e}
.ng{color:#ef4444}
.warn{color:#f59e0b}
.info{color:#fca5a5}
</style>
</head>

<body>
<div class="container">
  <h1>Webhook Token Checker</h1>

  <textarea id="token"
    placeholder="Webhook URLを改行で貼り付け"></textarea>

  <button class="check" onclick="check()">チェック</button>
  <button class="clear" onclick="clearLog()">ログクリア</button>

  <div class="log" id="log">待機中</div>
</div>

<script>
const tokenEl = document.getElementById("token");
const logEl = document.getElementById("log");

function now(){
  const d=new Date();
  return `[${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}]`;
}

function log(text,cls="info"){
  logEl.innerHTML += `<br><span class="${cls}">${now()} ${text}</span>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog(){
  logEl.innerHTML = "ログをクリアしました";
}

function isWebhookUrl(url){
  return /^https:\/\/(canary\.|ptb\.)?discord\.com\/api\/webhooks\/\d+\/[\w-]+$/i.test(url);
}

function fetchWithTimeout(url, ms=5000){
  return Promise.race([
    fetch(url,{method:"GET"}),
    new Promise((_,reject)=>setTimeout(()=>reject("timeout"),ms))
  ]);
}

async function check(){
  logEl.innerHTML = "";
  const urls = tokenEl.value.split("\n").map(v=>v.trim()).filter(Boolean);

  if(urls.length===0){
    log("❌ 入力がありません","ng");
    return;
  }

  log(`▶ ${urls.length} 件チェック開始`);

  for(const url of urls){
    if(!isWebhookUrl(url)){
      log("❌ URL形式エラー","ng");
      continue;
    }

    try{
      const res = await fetchWithTimeout(url,5000);
      if(res.ok){
        log("✅ このトークンは使えます","ok");
      }else{
        log(`❌ 無効 (${res.status})`,"ng");
      }
    }catch(e){
      if(e==="timeout"){
        log("⚠ タイムアウト（判定不可）","warn");
      }else{
        log("⚠ CORS制限で判定不可","warn");
      }
    }
  }

  log("■ チェック完了","info");
}
</script>
</body>
</html>
