<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Webhook Token Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,sans-serif;
  color:#fee2e2;
}
.container{
  width:94%;
  max-width:520px;
  padding:24px;
  background:linear-gradient(145deg,#1a0000,#000);
  border-radius:18px;
  border:1px solid #7f1d1d;
  box-shadow:0 0 40px rgba(239,68,68,.35);
}
h1{
  text-align:center;
  margin-bottom:18px;
  font-size:26px;
  background:linear-gradient(90deg,#fecaca,#ef4444,#7f1d1d);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
textarea{
  width:100%;
  box-sizing:border-box;
  margin-top:10px;
  padding:14px;
  border-radius:12px;
  background:#000;
  color:#fee2e2;
  border:1px solid #7f1d1d;
  outline:none;
  font-size:14px;
  resize:none;
  height:140px;
}
button{
  width:100%;
  margin-top:14px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  border-radius:14px;
  border:none;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#dc2626,#ef4444,#7f1d1d);
}
.log{
  margin-top:14px;
  font-size:13px;
  max-height:160px;
  overflow:auto;
  color:#fecaca;
}
</style>
</head>

<body>
<div class="container">
  <h1>Webhook Token Checker</h1>

  <textarea id="token"
    placeholder="Discord Webhook URL を貼り付けてください"></textarea>

  <button onclick="check()">チェック</button>

  <div class="log" id="log"></div>
</div>

<script>
const tokenEl = document.getElementById("token");
const logEl = document.getElementById("log");

function now(){
  const d=new Date();
  const h=String(d.getHours()).padStart(2,"0");
  const m=String(d.getMinutes()).padStart(2,"0");
  const s=String(d.getSeconds()).padStart(2,"0");
  return `[${h}:${m}:${s}]`;
}

function log(text){
  logEl.innerHTML += `${now()} ${text}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function isWebhookUrl(url){
  return /^https:\/\/(canary\.|ptb\.)?discord\.com\/api\/webhooks\/\d+\/[\w-]+$/i.test(url);
}

function check(){
  logEl.innerHTML = "";
  const url = tokenEl.value.trim();

  if(!url){
    log("❌ トークンが入力されていません");
    return;
  }

  if(!isWebhookUrl(url)){
    log("❌ Webhook URL の形式が不正です");
    return;
  }

  log("🔍 チェック中…");

  fetch(url,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ content:" " }) // 空送信
  })
  .then(res=>{
    if(res.status === 204){
      log("✅ このトークンは使えます");
    }else{
      log("❌ このトークンは使えません");
    }
  })
  .catch(()=>{
    log("❌ このトークンは使えません");
  });
}
</script>
</body>
</html>
