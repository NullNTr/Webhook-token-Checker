<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Webhook Token Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box; /* ← 超重要 */
}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,sans-serif;
  color:#fee2e2;
}

.container{
  width:100%;
  max-width:520px;
  margin:12px;
  padding:20px;
  background:linear-gradient(145deg,#1a0000,#000);
  border-radius:18px;
  border:1px solid #7f1d1d;
  box-shadow:0 0 40px rgba(239,68,68,.35);
  overflow:hidden; /* ← はみ出し防止 */
}

h1{
  text-align:center;
  margin-bottom:16px;
  font-size:24px;
  background:linear-gradient(90deg,#fecaca,#ef4444,#7f1d1d);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

textarea{
  width:100%;
  display:block;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  background:#000;
  color:#fee2e2;
  border:1px solid #7f1d1d;
  font-size:14px;
  resize:none;
  height:120px;
}

button{
  width:100%;
  display:block;
  margin-top:12px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
  border-radius:14px;
  border:none;
  cursor:pointer;
  color:white;
}

.check{
  background:linear-gradient(135deg,#dc2626,#ef4444,#7f1d1d);
}

.clear{
  background:linear-gradient(135deg,#374151,#111827);
}

.log{
  margin-top:14px;
  font-size:13px;
  max-height:160px;
  overflow:auto;
  color:#fecaca;
  word-break:break-all; /* ← 長文対策 */
}
</style>
</head>

<body>
<div class="container">
  <h1>Webhook Token Checker</h1>

  <textarea id="token" placeholder="Webhook URLを貼り付けてください"></textarea>

  <button class="check" onclick="check()">チェック</button>
  <button class="clear" onclick="clearLog()">ログクリア</button>

  <div class="log" id="log"></div>
</div>

<script>
const tokenEl = document.getElementById("token");
const logEl = document.getElementById("log");

function now(){
  return "[" + new Date().toLocaleTimeString() + "]";
}

function log(t){
  logEl.innerHTML += `${now()} ${t}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog(){
  logEl.innerHTML = "";
}

function isWebhookUrl(url){
  return /^https:\/\/(canary\.|ptb\.)?discord\.com\/api\/webhooks\/\d+\/[\w-]+$/i.test(url);
}

function check(){
  clearLog();
  const url = tokenEl.value.trim();

  if(!url){
    log("❌ URLが入力されていません");
    return;
  }

  if(!isWebhookUrl(url)){
    log("❌ Webhook URLではありません");
    return;
  }

  log("⏳ チェック中…");

  fetch(url)
    .then(r=>{
      if(!r.ok) throw new Error();
      return r.json();
    })
    .then(d=>{
      log("✅ Webhookは有効です");
      if(d.guild?.name) log("🏠 サーバー名: " + d.guild.name);
      if(d.guild_id) log("🆔 サーバーID: " + d.guild_id);
      if(d.channel?.name) log("💬 チャンネル名: " + d.channel.name);
      if(d.channel_id) log("🆔 チャンネルID: " + d.channel_id);
    })
    .catch(()=>{
      log("❌ Webhookは無効です");
    });
}
</script>
</body>
</html>
