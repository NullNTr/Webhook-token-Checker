<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Webhook Token Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,sans-serif;
  color:#fee2e2;
}

.container{
  width:92%;
  max-width:520px;
  padding:24px;
  background:linear-gradient(145deg,#1a0000,#000);
  border-radius:18px;
  border:1px solid #7f1d1d;
  box-shadow:0 0 40px rgba(239,68,68,.35);
}

h1{
  text-align:center;
  margin-bottom:18px;
  font-size:26px;
  background:linear-gradient(90deg,#fecaca,#ef4444,#7f1d1d);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

textarea{
  width:100%;
  margin-top:10px;
  padding:14px;
  border-radius:12px;
  background:#000;
  color:#fee2e2;
  border:1px solid #7f1d1d;
  outline:none;
  font-size:14px;
  resize:none;
  height:130px;
  word-break:break-all;
}

button{
  width:100%;
  margin-top:14px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  border-radius:14px;
  border:none;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#dc2626,#ef4444,#7f1d1d);
}

.clear{
  margin-top:8px;
  background:#111;
}

.log{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  border:1px solid #7f1d1d;
  background:#000;
  font-size:13px;
  max-height:180px;
  overflow:auto;
}
a{color:#fca5a5}
</style>
</head>

<body>
<div class="container">
  <h1>Webhook Token Checker</h1>

  <textarea id="token" placeholder="WebhookのURLを貼り付けてください"></textarea>

  <button onclick="check()">チェック</button>
  <button class="clear" onclick="clearLog()">ログクリア</button>

  <div class="log" id="log"></div>
</div>

<script>
const logEl = document.getElementById("log");
const tokenEl = document.getElementById("token");

function now(){
  const d=new Date();
  return `[${d.toLocaleTimeString()}]`;
}

function log(t){
  logEl.innerHTML += `${now()} ${t}<br>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function clearLog(){
  logEl.innerHTML="";
}

function isWebhookUrl(url){
  return /^https:\/\/(canary\.|ptb\.)?discord\.com\/api\/webhooks\/\d+\/[\w-]+$/i.test(url);
}

async function check(){
  clearLog();
  const url = tokenEl.value.trim();

  if(!url){
    log("❌ URLが入力されていません");
    return;
  }

  if(!isWebhookUrl(url)){
    log("❌ WebhookのURLではありません");
    return;
  }

  log("⏳ チェック開始");

  try{
    const res = await fetch(url);
    if(!res.ok){
      log("❌ このWebhookは無効です");
      return;
    }

    const data = await res.json();

    log("✅ Webhookは有効です");
    log(`🔗 Webhook名：${data.name || "不明"}`);
    log(`🆔 サーバーID：${data.guild_id || "取得不可"}`);
    log(`📌 チャンネルID：${data.channel_id || "取得不可"}`);

    if(data.guild_id && data.channel_id){
      const link = `https://discord.com/channels/${data.guild_id}/${data.channel_id}`;
      log(`➡ チャンネルリンク：<a href="${link}" target="_blank">${link}</a>`);
    }

    log("ℹ サーバー名・招待リンクはWebhookのみでは取得不可");

  }catch(e){
    log("❌ 通信エラー");
  }
}
</script>
</body>
</html>
